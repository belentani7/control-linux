name: codeql
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          # El input `languages` solo se divide por comas (getRawLanguagesNoAutodetect),
          # no por espacios ni saltos de línea.
          languages: python,javascript
      - uses: github/codeql-action/analyze@v4
