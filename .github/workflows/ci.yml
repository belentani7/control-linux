name: CI
on: [push, pull_request]
jobs:
  node-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificación de protocolos
        run: test -f README.md && test -f LICENSE && test -f .gitignore
      - name: Sintaxis JS
        run: find . -name "*.js" -not -path "./node_modules/*" -not -name "*.min.js" -not -path "./legacy/*" | xargs -r -n1 node --check
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Test
        run: npm test --if-present
